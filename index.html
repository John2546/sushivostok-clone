<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sushi Vostok Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">Sushi Vostok</div>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#menu">Menu</a></li>
                <li><a href="#order">Order</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section id="home" class="hero">
        <h1>Fresh Sushi Delivered</h1>
        <p>Experience the taste of the East in every bite.</p>
        <button onclick="orderNow()">Order Now</button>
    </section>

    <section id="menu" class="menu">
        <h2>Menu Highlights</h2>
        <div class="items">
            <div class="item">
                <img src="images/sushi1.jpg" alt="Sushi Roll">
                <h3>California Roll</h3>
            </div>
            <div class="item">
                <img src="images/sushi2.jpg" alt="Sushi Roll">
                <h3>Philadelphia Roll</h3>
            </div>
            <div class="item">
                <img src="images/sushi3.jpg" alt="Sushi Roll">
                <h3>Dragon Roll</h3>
            </div>
        </div>
    </section>

    <section id="order" class="order">
        <h2>Place an Order</h2>
        <form id="orderForm">
            <input type="text" name="name" placeholder="Your Name" required>
            <input type="text" name="address" placeholder="Delivery Address" required>
            <button type="submit">Submit</button>
        </form>
    </section>

    <section id="contact" class="contact">
        <h2>Contact Us</h2>
        <p>Email: info@example.com</p>
        <p>Phone: +1 234 567 890</p>
    </section>

    <footer>
        <p>&copy; 2025 Sushi Vostok Clone</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
